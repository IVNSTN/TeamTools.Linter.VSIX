
name: Release

permissions:
  contents: write
  actions: read

on:

  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to run on'
        required: true
        default: 'main'

jobs:

  prepare:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Grab VSIX
      uses: dawidd6/action-download-artifact@v11
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        workflow: ci.yml
        workflow_conclusion: completed
        branch: main

    - name: Detect versions
      id: get-tag
      run: |
        ALL=$(jq -r '.ALL' 'vsix-versions.json/vsix-versions.json')
        TAG=$(jq -r '.VS_2019' 'vsix-versions.json/vsix-versions.json')
        echo "ALL_VERSIONS=$ALL" >> $GITHUB_OUTPUT
        echo "TAG=v$TAG" >> $GITHUB_OUTPUT
      shell: bash

    - name: Create release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "*.vsix"
        generateReleaseNotes: true
        draft: true
        name: Release ${{ steps.get-tag.outputs.ALL_VERSIONS}}
        tag: ${{ steps.get-tag.outputs.TAG}}

    - name: Locate VSIX binaries
      id: locate
      run: |
        find '.' -type f -iname 'TeamTools*'

        VSIX_2019=$(find '.' -type f -iname 'TeamTools*-2019*.vsix' -print -quit)
        VSIX_2022=$(find '.' -type f -iname 'TeamTools*-2022*.vsix' -print -quit)

        echo $VSIX_2019
        echo $VSIX_2022

        echo "VSIX_2019=$VSIX_2019" >> $GITHUB_OUTPUT
        echo "VSIX_2022=$VSIX_2022" >> $GITHUB_OUTPUT
      shell: bash

    - name: Publish VSIX 2019
      uses: cezarypiatek/VsixPublisherAction@1.2
      with:
        publish-manifest-file: vsix_marketplace_publish_manifest.json
        personal-access-code: ${{ secrets.VS_PUBLISHER_ACCESS_TOKEN }}
        extension-file: '${{ steps.locate.outputs.VSIX_2019 }}'

    - name: Publish VSIX 2022
      uses: cezarypiatek/VsixPublisherAction@1.2
      with:
        publish-manifest-file: vsix_marketplace_publish_manifest.json
        personal-access-code: ${{ secrets.VS_PUBLISHER_ACCESS_TOKEN }}
        extension-file: ${{ steps.locate.outputs.VSIX_2022 }}
