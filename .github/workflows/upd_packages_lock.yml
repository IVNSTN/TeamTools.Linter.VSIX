name: Update Lockfile

on:
  push:
    paths:
      - '**/*.csproj'
    branches-ignore: [ "main" ]

  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to run on'
        required: true
        default: 'dev'

env:
  SOLUTION_FILE_PATH: TeamTools.Linter.VsExtension.sln
  LOCAL_PACKAGES: ${{ github.workspace }}/local_packages/

jobs:
  update:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
            4.7.8
            3.1.x
            10.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Grab TSQL plugin
      uses: dawidd6/action-download-artifact@v11
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        repo: IVNSTN/TeamTools.Linter.TSQL
        workflow: ci.yml
        workflow_conclusion: completed
        branch: main
        name: nuget-packages
        name_is_regexp: false
        path: ${{ env.LOCAL_PACKAGES }}

    - name: Grab SSDT plugin
      uses: dawidd6/action-download-artifact@v11
      with:
        github_token: ${{secrets.GITHUB_TOKEN}}
        repo: IVNSTN/TeamTools.Linter.SSDT
        workflow: ci.yml
        workflow_conclusion: completed
        branch: main
        name: nuget-packages
        name_is_regexp: false
        path: ${{ env.LOCAL_PACKAGES }}

    - name: Restore and update lock files
      run: dotnet msbuild ${{env.SOLUTION_FILE_PATH}} -t:Restore -p:RestoreForceEvaluate=true

    - name: Commit updated lock files
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: update packages.lock.json"
